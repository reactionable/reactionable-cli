name: Internal - Common Continuous Integration tasks

on:
  workflow_call:
    outputs:
      package-tarball-artifact-id:
        description: The package tarball validated by CI
        value: ${{ jobs.continuous-integration.outputs.package-tarball-artifact-id }}
      build-artifact-id:
        description: Build artifact containing the compiled CLI and documentation
        value: ${{ jobs.continuous-integration.outputs.build-artifact-id }}

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@fbd3522b68c55a6314aadbededaa487825ba9b35 # 3.0.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      package: |
        {
          "tests": "reactionable --help\ntest \"$(reactionable --version)\" = \"$PACKAGE_VERSION\"\ntest -f \"$PACKAGE_INSTALL_PATH/dist/templates/i18n/config.template.js\"\n"
        }
      build: |
        {
          "commands": ["build", "build:doc"],
          "artifact": ["build", "dist"]
        }
      test: |
        { "coverage": "codecov" }
